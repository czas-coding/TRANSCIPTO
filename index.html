<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRANSCIPNIJIAN</title>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1c1e24;
      --border: #2e323b;
      --text: #e6e8ec;
      --muted: #8b92a0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    input, select, textarea, button {
      width: 100%;
      background: #111215;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: #232730;
      border-color: var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: #2d323e; }

    .status-box {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2rem;
      margin-top: 0.5rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .progress-bar-container {
      width: 100%;
      background: #101114;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
      display: none;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    textarea {
      resize: vertical;
      min-height: 340px;
      line-height: 1.5;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .action-row {
      display: flex;
      gap: 0.5rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>TRANSCIPNIJIAN</h1>
    <p class="subtitle">High Capacity Video-to-Text Engine (Max 200MB / Up to 2 Hours)</p>
  </header>

  <section class="panel">
    <div class="grid-2">
      <div>
        <label for="modelSelect">Gemini Engine</label>
        <select id="modelSelect">
          <option value="gemini-3.5-flash-lite" selected>gemini-3.5-flash-lite (Recommended: 500 RPD / 15 RPM)</option>
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (Backup: 500 RPD / 15 RPM)</option>
          <option value="gemini-3.8-flash">gemini-3.8-flash (20 RPD / 5 RPM)</option>
        </select>
      </div>

      <div>
        <label for="fileInput">Select Video / Audio File (Max: 200MB & 2 Hrs)</label>
        <input type="file" id="fileInput" accept="video/*,audio/*">
      </div>
    </div>

    <div style="margin-top: 1rem;">
      <label for="promptConfig">Prompt Instructions</label>
      <input type="text" id="promptConfig" value="Transcribe the spoken audio verbatim in full detail with speaker labels and clear timestamps [MM:SS].">
    </div>

    <div class="btn-group">
      <button id="startBtn" class="btn-primary" onclick="startTranscription()">Start Fast Transcription</button>
      <button id="cancelBtn" class="btn-secondary" onclick="abortOperation()" disabled>Cancel</button>
    </div>

    <div class="progress-bar-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-box" id="statusLog">Ready. Select a file up to 200MB and click Start Fast Transcription.</div>
  </section>

  <section class="panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
      <label style="margin: 0;">Transcription Output</label>
      <div class="action-row">
        <button class="btn-secondary" style="width: auto; padding: 0.25rem 0.6rem; font-size: 0.75rem;" onclick="copyTranscript()">Copy Text</button>
        <button class="btn-secondary" style="width: auto; padding: 0.25rem 0.6rem; font-size: 0.75rem;" onclick="downloadTranscript()">Download .TXT</button>
      </div>
    </div>
    <textarea id="outputArea" placeholder="Transcription will stream in real time here..."></textarea>
    <div class="meta-bar">
      <span id="charCount">0 characters</span>
      <span id="elapsedTime"></span>
    </div>
  </section>
</div>

<script>
  const KEY_PARTS = [
    "AQ.Ab8RN6IUbPmub",
    "J9PeVUqLFFw27htt",
    "Lc3na1dKMwLNKNruqEeqg"
  ];
  function getDecodedKey() {
    return KEY_PARTS.join('');
  }

  const MAX_FILE_SIZE_BYTES = 200 * 1024 * 1024; // 200 MB
  const MAX_DURATION_SECONDS = 7200; // 2 Hours
  let abortController = null;
  let currentFileName = "transcript";

  function updateStatus(msg, isError = false) {
    const el = document.getElementById('statusLog');
    el.textContent = msg;
    el.style.color = isError ? 'var(--danger)' : 'var(--muted)';
  }

  function setProgress(pct) {
    const bar = document.getElementById('progressBar');
    const container = document.getElementById('progressContainer');
    if (pct === null) {
      container.style.display = 'none';
      bar.style.width = '0%';
    } else {
      container.style.display = 'block';
      bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
    }
  }

  function validateFile(file) {
    return new Promise((resolve) => {
      if (file.size > MAX_FILE_SIZE_BYTES) {
        return resolve({
          valid: false,
          error: `File size (${(file.size / (1024 * 1024)).toFixed(1)} MB) exceeds the 200MB limit.`
        });
      }

      const media = document.createElement(file.type.startsWith('video') ? 'video' : 'audio');
      media.preload = 'metadata';
      media.onloadedmetadata = () => {
        window.URL.revokeObjectURL(media.src);
        if (media.duration > MAX_DURATION_SECONDS) {
          resolve({ valid: false, error: `File duration (${Math.round(media.duration / 60)} mins) exceeds 2 hours.` });
        } else {
          resolve({ valid: true });
        }
      };
      media.onerror = () => resolve({ valid: true });
      media.src = URL.createObjectURL(file);
    });
  }

  async function uploadViaResumableApi(file, apiKey, signal) {
    updateStatus(`Uploading ${(file.size / (1024 * 1024)).toFixed(1)} MB directly to Google Files API...`);
    setProgress(20);

    const initRes = await fetch(`https://generativelanguage.googleapis.com/upload/v1beta/files?key=${apiKey}`, {
      method: 'POST',
      headers: {
        'X-Goog-Upload-Protocol': 'resumable',
        'X-Goog-Upload-Command': 'start',
        'X-Goog-Upload-Header-Content-Length': file.size.toString(),
        'X-Goog-Upload-Header-Content-Type': file.type || 'application/octet-stream',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ file: { display_name: file.name } }),
      signal
    });

    if (!initRes.ok) {
      const err = await initRes.text();
      throw new Error(`Upload handshake failed: ${initRes.status} - ${err}`);
    }

    const uploadUrl = initRes.headers.get('x-goog-upload-url');
    if (!uploadUrl) throw new Error('Upload URL missing from server response.');

    setProgress(45);
    const uploadRes = await fetch(uploadUrl, {
      method: 'POST',
      headers: {
        'Content-Length': file.size.toString(),
        'X-Goog-Upload-Offset': '0',
        'X-Goog-Upload-Command': 'upload, finalize'
      },
      body: file,
      signal
    });

    if (!uploadRes.ok) throw new Error(`Upload transfer failed: ${uploadRes.status}`);
    const result = await uploadRes.json();
    setProgress(70);
    return result.file;
  }

  async function pollFileProcessing(fileName, apiKey, signal) {
    updateStatus('Upload complete. Waiting for Gemini media ingestion...');
    while (true) {
      if (signal.aborted) throw new Error('Canceled');

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileName}?key=${apiKey}`, { signal });
      if (!res.ok) throw new Error(`Status check failed: ${res.status}`);
      const data = await res.json();

      if (data.state === 'ACTIVE') return data.uri;
      if (data.state === 'FAILED') throw new Error('Media file processing failed on server.');

      await new Promise(r => setTimeout(r, 3000));
    }
  }

  async function executeTranscriptionWithRetry(fileUri, mimeType, primaryModel, prompt, apiKey, signal, onChunk) {
    const candidateModels = [
      primaryModel,
      'gemini-3.5-flash-lite',
      'gemini-3.1-flash-lite',
      'gemini-3.8-flash'
    ].filter((m, i, self) => self.indexOf(m) === i);

    for (let modelIndex = 0; modelIndex < candidateModels.length; modelIndex++) {
      const model = candidateModels[modelIndex];
      let maxAttempts = 3;

      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        if (signal.aborted) throw new Error('Canceled');
        updateStatus(`Transcribing with ${model}${attempt > 1 ? ` (Retry ${attempt}/${maxAttempts})` : ''}...`);
        setProgress(85);

        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { fileData: { fileUri, mimeType } },
                  { text: prompt }
                ]
              }],
              generationConfig: {
                temperature: 0.1
              }
            }),
            signal
          });

          if (res.status === 503 || res.status === 429) {
            updateStatus(`Notice: ${model} is experiencing high demand (Code ${res.status}). Retrying in 4 seconds...`);
            await new Promise(r => setTimeout(r, 4000));
            continue;
          }

          if (res.status === 404 || res.status === 400) {
            console.warn(`Model ${model} returned ${res.status}. Falling back to next model...`);
            break;
          }

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`API Error ${res.status}: ${errText}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let accumulatedText = '';
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const jsonStr = line.slice(6).trim();
                if (jsonStr) {
                  try {
                    const parsed = JSON.parse(jsonStr);
                    const textChunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (textChunk) {
                      accumulatedText += textChunk;
                      onChunk(accumulatedText);
                    }
                  } catch (e) {}
                }
              }
            }
          }

          if (accumulatedText.trim().length > 0) {
            return accumulatedText;
          }
          throw new Error('Received empty transcript response.');
        } catch (err) {
          if (err.name === 'AbortError') throw err;
          if (attempt === maxAttempts) {
            console.warn(`Exhausted attempts for ${model}:`, err);
            break;
          }
          await new Promise(r => setTimeout(r, 3000));
        }
      }
    }
    throw new Error('All supported high-quota models are currently busy. Please wait a minute and try again.');
  }

  async function startTranscription() {
    const fileInput = document.getElementById('fileInput');
    const model = document.getElementById('modelSelect').value;
    const prompt = document.getElementById('promptConfig').value;
    const startBtn = document.getElementById('startBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const outputArea = document.getElementById('outputArea');

    if (!fileInput.files.length) {
      updateStatus('Please select a video or audio file first.', true);
      return;
    }

    const file = fileInput.files[0];
    currentFileName = file.name.replace(/\.[^/.]+$/, "");
    const apiKey = getDecodedKey();

    startBtn.disabled = true;
    cancelBtn.disabled = false;
    outputArea.value = '';
    abortController = new AbortController();
    const startTime = Date.now();

    try {
      updateStatus('Validating file parameters (Max: 200MB / 2 Hours)...');
      const check = await validateFile(file);
      if (!check.valid) throw new Error(check.error);

      // Resumable upload directly sends the 150MB-200MB file without browser memory limits
      const uploadedFile = await uploadViaResumableApi(file, apiKey, abortController.signal);
      
      // Wait for ingestion
      const activeUri = await pollFileProcessing(uploadedFile.name, apiKey, abortController.signal);

      // Stream transcription with automatic high-demand 503 recovery and model fallback
      const finalTranscript = await executeTranscriptionWithRetry(
        activeUri,
        file.type,
        model,
        prompt,
        apiKey,
        abortController.signal,
        (chunk) => {
          outputArea.value = chunk;
          document.getElementById('charCount').textContent = `${chunk.length} characters`;
          outputArea.scrollTop = outputArea.scrollHeight;
        }
      );

      const elapsed = Math.round((Date.now() - startTime) / 1000);
      document.getElementById('elapsedTime').textContent = `Done in ${elapsed}s`;
      setProgress(100);
      updateStatus('Transcription completed successfully.');
    } catch (err) {
      updateStatus(err.name === 'AbortError' ? 'Canceled by user.' : `Error: ${err.message}`, true);
    } finally {
      startBtn.disabled = false;
      cancelBtn.disabled = true;
      setProgress(null);
      abortController = null;
    }
  }

  function abortOperation() {
    if (abortController) abortController.abort();
  }

  function copyTranscript() {
    const text = document.getElementById('outputArea').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const prev = document.getElementById('statusLog').textContent;
      updateStatus('Copied to clipboard!');
      setTimeout(() => updateStatus(prev), 2000);
    });
  }

  function downloadTranscript() {
    const text = document.getElementById('outputArea').value;
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${currentFileName}_transcript.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
